name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom version tag (e.g. v1.0.1) or leave empty for automatic'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    # Skip if commit message explicitly says [skip ci] or [skip release]
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version & Tag
        id: versioning
        run: |
          # 1. If triggered by an existing git tag push
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "Triggered by tag: $TAG (version: $VERSION)"
          # 2. If triggered manually with custom version input
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            INPUT_VER="${{ github.event.inputs.version }}"
            TAG="v${INPUT_VER#v}"
            VERSION="${TAG#v}"
            echo "Triggered manually with version: $TAG"
          # 3. If triggered by push to main branch
          else
            PKG_VER=$(node -p "require('./package.json').version")
            CANDIDATE_TAG="v$PKG_VER"
            
            # Check if this tag already exists in remote tags
            if git rev-parse "$CANDIDATE_TAG" >/dev/null 2>&1; then
              echo "Tag $CANDIDATE_TAG already exists. Auto-incrementing patch version..."
              IFS='.' read -r major minor patch <<< "$PKG_VER"
              patch=$((patch + 1))
              VERSION="$major.$minor.$patch"
              TAG="v$VERSION"
            else
              VERSION="$PKG_VER"
              TAG="$CANDIDATE_TAG"
            fi
            echo "Determined next version: $TAG (version: $VERSION)"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android XML Resources
        run: |
          ls -la android/app/src/main/res/xml/

      - name: Update Android Version in build.gradle
        run: |
          VERSION="${{ steps.versioning.outputs.version }}"
          echo "Syncing Android versionName to $VERSION"
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release-output
          TAG="${{ steps.versioning.outputs.tag }}"
          
          # Find generated release APK (signed by debug key for immediate installation)
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            # Fallback if named differently
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          
          echo "Found APK at: $APK_PATH"
          DEST_NAME="Furigana-Reader-${TAG}.apk"
          cp "$APK_PATH" "release-output/$DEST_NAME"
          echo "Created release-output/$DEST_NAME"

      - name: Create or Update Git Tag
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating and pushing tag $TAG..."
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists on remote."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Furigana Reader ${{ steps.versioning.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
